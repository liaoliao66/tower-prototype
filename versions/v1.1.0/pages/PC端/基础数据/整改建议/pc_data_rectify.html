          <select class="form-select" id="formLevel"><option>A级</option><option>B级</option><option>C级</option></select>

      return { id: lv, label: lv + "隐患" };
    }));
    items.forEach(function (item) {
      var n = rows.filter(function (r) { return item.id === "全部" || r.level === item.id; }).length;
      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "btn btn-default" + (item.id === current ? " on" : "");
      btn.textContent = item.label + "（" + n + "）";
      btn.addEventListener("click", function () {
        current = item.id;
        document.getElementById("kwFilter").value = "";
        document.getElementById("statusFilter").value = "";
        catFilter.value = "";
        fillCats();
        renderTabs();
        apply();
      });
      box.appendChild(btn);
    });
  }
  function filtered() {
    var picked = parseCatFilter();
    var kw = document.getElementById("kwFilter").value.trim();
    var st = document.getElementById("statusFilter").value;
    return rows.filter(function (r) {
      if (current !== "全部" && r.level !== current) return false;
      if (picked.level && current === "全部" && r.level !== picked.level) return false;
      if (picked.cat && r.cat !== picked.cat) return false;
      if (st && r.status !== st) return false;
      if (!kw) return true;
      return ((r.level || "") + (r.cat || "") + (r.hazard || "") + (r.advice || "")).indexOf(kw) >= 0;
    });
  }
  function emptyCats() {
    var kw = document.getElementById("kwFilter").value.trim();
    if (document.getElementById("statusFilter").value) return [];
    var picked = parseCatFilter();
    return cats.filter(function (c) {
      if (current !== "全部" && c.level !== current) return false;
      if (picked.level && c.level !== picked.level) return false;
      if (picked.cat && c.cat !== picked.cat) return false;
      if (kw && (c.level + c.cat).indexOf(kw) < 0) return false;
      return !rows.some(function (r) { return r.level === c.level && r.cat === c.cat; });
    });
  }
  function advicePlan(list) {
    var skip = {};
    var span = {};
    for (var i = 0; i < list.length; i++) {
      var need = list[i].adviceSpan || 0;
      if (!need || list[i].adviceSkip) continue;
      var ok = true;
      for (var k = 1; k < need; k++) {
        if (!list[i + k] || !list[i + k].adviceSkip) { ok = false; break; }
      }
      if (!ok) continue;
      span[i] = need;
      for (var k2 = 1; k2 < need; k2++) skip[i + k2] = 1;
    }
    return { skip: skip, span: span };
  }
  function breakGroup(row) {
    var i = rows.indexOf(row);
    if (i < 0) return;
    var s = i;
    if (row.adviceSkip) {
      while (s > 0 && rows[s].adviceSkip) s--;
      if (s > 0 && rows[s - 1].adviceSpan && !rows[s - 1].adviceSkip) s--;
    }
    var span = rows[s] && rows[s].adviceSpan ? rows[s].adviceSpan : (row.adviceSpan || 0);
    if (!span) return;
    for (var k = 0; k < span && rows[s + k]; k++) {
      delete rows[s + k].adviceSpan;
      delete rows[s + k].adviceSkip;
    }
  }
  function place(row) {
    var i = rows.indexOf(row);
    if (i >= 0) rows.splice(i, 1);
    var at = rows.length;
    var foundCat = false;
    for (var k = rows.length - 1; k >= 0; k--) {
      if (rows[k].level === row.level && rows[k].cat === row.cat) { at = k + 1; foundCat = true; break; }
    }
    if (!foundCat) {
      for (var k2 = rows.length - 1; k2 >= 0; k2--) {
        if (rows[k2].level === row.level) { at = k2 + 1; break; }
      }
    }
    rows.splice(at, 0, row);
  }
  function addCategory(level, name) {
    var at = cats.length;
    var found = false;
    for (var i = cats.length - 1; i >= 0; i--) {
      if (cats[i].level === level) { at = i + 1; found = true; break; }
    }
    if (!found) {
      var order = { "A级": 0, "B级": 1, "C级": 2 };
      at = 0;
      cats.forEach(function (c, idx) {
        if (order[c.level] < order[level]) at = idx + 1;
      });
    }
    cats.splice(at, 0, { level: level, cat: name });
  }
  function openCatForm() {
    document.getElementById("catLevel").value = current === "全部" ? "A级" : current;
    document.getElementById("catName").value = "";
    document.getElementById("catMask").classList.add("open");
    document.getElementById("catName").focus();
  }
  function closeCatForm() { document.getElementById("catMask").classList.remove("open"); }
  function saveCatForm() {
    var level = document.getElementById("catLevel").value;
    var name = document.getElementById("catName").value.trim();
    if (!level) { alert("请选择级别"); return; }
    if (!name) { alert("请填写分类名称"); return; }
    if (cats.some(function (c) { return c.level === level && c.cat === name; })) {
      alert("该级别下已有相同分类");
      return;
    }
    addCategory(level, name);
    if (current !== "全部") current = level;
    document.getElementById("statusFilter").value = "";
    document.getElementById("kwFilter").value = "";
    closeCatForm();
    fillCats();
    catFilter.value = current === "全部" ? catKey(level, name) : name;
    renderTabs();
    apply();
  }
  function openForm(row) {
    editingId = row ? row.id : 0;
    document.getElementById("formTitle").textContent = row ? "编辑整改建议" : "新增隐患";
    var level = row ? row.level : (current === "全部" ? "A级" : current);
    var selected = row ? row.cat : "";
    if (!row) {
      var picked = parseCatFilter();
      if (picked.level) level = picked.level;
      if (picked.cat) selected = picked.cat;
    }
    document.getElementById("formLevel").value = level;
    fillFormCats(level, selected);
    document.getElementById("formHazard").value = row ? row.hazard : "";
    document.getElementById("formAdvice").value = row ? (row.advice || "") : "";
    document.getElementById("formStatus").value = row ? row.status : "上架";
    document.getElementById("formMask").classList.add("open");
  }
  function closeForm() { document.getElementById("formMask").classList.remove("open"); editingId = 0; }
  function saveForm() {
    var level = document.getElementById("formLevel").value;
    var cat = document.getElementById("formCat").value.trim();
    var hazard = document.getElementById("formHazard").value.trim();
    var advice = document.getElementById("formAdvice").value.trim();
    var status = document.getElementById("formStatus").value;
    if (!level) { alert("请选择级别"); return; }
    if (!cat) { alert("请先新增分类"); return; }
    if (!cats.some(function (c) { return c.level === level && c.cat === cat; })) { alert("请选择已有分类"); return; }
    if (!hazard) { alert("请填写隐患描述"); return; }
    var dup = rows.some(function (r) {
      return r.id !== editingId && r.level === level && r.cat === cat && r.hazard === hazard;
    });
    if (dup) { alert("同一级别、同一分类下已有相同隐患描述"); return; }
    var row = editingId ? byId(editingId) : null;
    if (row) {
      breakGroup(row);
      row.level = level;
      row.cat = cat;
      row.hazard = hazard;
      row.advice = advice;
      row.status = status;
      place(row);
    } else {
      row = { id: nextId++, level: level, cat: cat, hazard: hazard, advice: advice, status: status };
      place(row);
    }
    if (current !== "全部") current = level;
    document.getElementById("statusFilter").value = "";
    document.getElementById("kwFilter").value = "";
    closeForm();
    fillCats();
    catFilter.value = current === "全部" ? catKey(level, cat) : cat;
    renderTabs();
    apply();
  }
  function openDelete(row) {
    pendingDeleteCat = null;
    pendingDeleteId = row.id;
    document.getElementById("delMsg").textContent = "确定删除「" + row.hazard + "」？将从整改建议中物理删除，且不可恢复。已产生的记录数据不受影响。";
    document.getElementById("delMask").classList.add("open");
  }
  function openDeleteCat(c) {
    pendingDeleteId = 0;
    pendingDeleteCat = c;
    document.getElementById("delMsg").textContent = "确定删除分类「" + c.cat + "」？该分类下暂无隐患，删除后不可恢复。已产生的记录数据不受影响。";
    document.getElementById("delMask").classList.add("open");
  }
  function closeDelete() {
    pendingDeleteId = 0;
    pendingDeleteCat = null;
    document.getElementById("delMask").classList.remove("open");
  }
  function statusCell(row) {
    var td = document.createElement("td");
    var tag = document.createElement("span");
    tag.className = "tag " + (row.status === "上架" ? "tag-green" : "tag-gray");
    tag.textContent = row.status;
    td.appendChild(tag);
    return td;
  }
  function actionCell(row) {
    var td = document.createElement("td");
    td.className = "col-action";
    function btn(text, color, fn) {
      var b = document.createElement("button");
      b.type = "button";
      b.className = "btn btn-text";
      b.textContent = text;
      if (color) b.style.color = color;
      b.addEventListener("click", fn);
      td.appendChild(b);
    }
    btn("编辑", "", function () { openForm(row); });
    btn(row.status === "上架" ? "下架" : "上架", row.status === "上架" ? "var(--warning)" : "var(--success)", function () {
      breakGroup(row);
      row.status = row.status === "上架" ? "下架" : "上架";
      apply();
    });
    btn("删除", "var(--danger)", function () { openDelete(row); });
    return td;
  }
  function render(list) {
    body.innerHTML = "";
    var showLevel = current === "全部";
    var cols = showLevel ? 6 : 5;
    document.getElementById("levelHead").style.display = showLevel ? "" : "none";
    document.getElementById("hazardHead").textContent = showLevel ? "隐患描述" : current + "隐患";
    var empties = emptyCats();
    var groups = [];
    cats.forEach(function (c) {
      if (current !== "全部" && c.level !== current) return;
      var picked = parseCatFilter();
      if (picked.level && c.level !== picked.level) return;
      if (picked.cat && c.cat !== picked.cat) return;
      var mine = list.filter(function (r) { return r.level === c.level && r.cat === c.cat; });
      var isEmpty = empties.some(function (e) { return e.level === c.level && e.cat === c.cat; });
      if (mine.length || isEmpty) groups.push({ level: c.level, cat: c.cat, rows: mine });
    });
    if (!groups.length) {
      body.innerHTML = '<tr><td colspan="' + cols + '" style="text-align:center;color:var(--text-3);padding:28px;">没有匹配的整改建议</td></tr>';
      countEl.textContent = "共 0 条记录";
      return;
    }
    var plan = advicePlan(list);
    var cursor = 0;
    groups.forEach(function (g) {
      if (!g.rows.length) {
        var tr0 = document.createElement("tr");
        if (showLevel) {
          var lv0 = document.createElement("td");
          lv0.textContent = g.level;
          tr0.appendChild(lv0);
        }
        var cat0 = document.createElement("td");
        cat0.className = "cat-cell";
        cat0.textContent = g.cat;
        tr0.appendChild(cat0);
        var empty = document.createElement("td");
        empty.className = "empty-hazard";
        empty.colSpan = 2;
        empty.style.color = "var(--text-3)";
        empty.textContent = "暂无隐患";
        tr0.appendChild(empty);
        var st0 = document.createElement("td");
        st0.textContent = "—";
        tr0.appendChild(st0);
        var act0 = document.createElement("td");
        act0.className = "col-action";
        var delCat = document.createElement("button");
        delCat.type = "button";
        delCat.className = "btn btn-text";
        delCat.style.color = "var(--danger)";
        delCat.textContent = "删除分类";
        delCat.addEventListener("click", function () { openDeleteCat(g); });
        act0.appendChild(delCat);
        tr0.appendChild(act0);
        body.appendChild(tr0);
        return;
      }
      g.rows.forEach(function (row, idx) {
        var k = cursor;
        var tr = document.createElement("tr");
        if (idx === 0) {
          if (showLevel) {
            var lv = document.createElement("td");
            lv.rowSpan = g.rows.length;
            lv.textContent = g.level;
            tr.appendChild(lv);
          }
          var catTd = document.createElement("td");
          catTd.className = "cat-cell";
          catTd.rowSpan = g.rows.length;
          catTd.textContent = g.cat;
          tr.appendChild(catTd);
        }
        var h = document.createElement("td");
        h.className = "hazard";
        h.textContent = row.hazard;
        tr.appendChild(h);
        if (!plan.skip[k]) {
          var a = document.createElement("td");
          a.className = "advice";
          if (plan.span[k]) { a.rowSpan = plan.span[k]; a.className += " advice-span"; }
          a.textContent = row.advice || "";
          tr.appendChild(a);
        }
        tr.appendChild(statusCell(row));
        tr.appendChild(actionCell(row));
        body.appendChild(tr);
        cursor++;
      });
    });
    countEl.textContent = "共 " + list.length + " 条记录";
  }
  function apply() { render(filtered()); }

  document.getElementById("btnQuery").addEventListener("click", apply);
  document.getElementById("kwFilter").addEventListener("keydown", function (e) { if (e.key === "Enter") apply(); });
  document.getElementById("kwFilter").addEventListener("input", apply);
  document.getElementById("statusFilter").addEventListener("change", apply);
  document.getElementById("btnReset").addEventListener("click", function () {
    document.getElementById("kwFilter").value = "";
    document.getElementById("statusFilter").value = "";
    catFilter.value = "";
    apply();
  });
  catFilter.addEventListener("change", apply);
  document.getElementById("btnAdd").addEventListener("click", function () { openForm(null); });
  document.getElementById("btnAddCat").addEventListener("click", openCatForm);
  document.getElementById("formLevel").addEventListener("change", function () { fillFormCats(this.value, ""); });
  document.getElementById("formSave").addEventListener("click", saveForm);
  document.getElementById("formCancel").addEventListener("click", closeForm);
  document.getElementById("formClose").addEventListener("click", closeForm);
  document.getElementById("formMask").addEventListener("click", function (e) { if (e.target.id === "formMask") closeForm(); });
  document.getElementById("catSave").addEventListener("click", saveCatForm);
  document.getElementById("catCancel").addEventListener("click", closeCatForm);
  document.getElementById("catClose").addEventListener("click", closeCatForm);
  document.getElementById("catMask").addEventListener("click", function (e) { if (e.target.id === "catMask") closeCatForm(); });
  document.getElementById("catName").addEventListener("keydown", function (e) { if (e.key === "Enter") saveCatForm(); });
  document.getElementById("delCancel").addEventListener("click", closeDelete);
  document.getElementById("delMask").addEventListener("click", function (e) { if (e.target.id === "delMask") closeDelete(); });
  document.getElementById("delOk").addEventListener("click", function () {
    if (pendingDeleteCat) {
      var target = pendingDeleteCat;
      closeDelete();
      if (rows.some(function (r) { return r.level === target.level && r.cat === target.cat; })) {
        alert("请先删除该分类下的隐患");
        return;
      }
      cats = cats.filter(function (c) { return !(c.level === target.level && c.cat === target.cat); });
      if (catFilter.value === catKey(target.level, target.cat) || catFilter.value === target.cat) catFilter.value = "";
      fillCats();
      renderTabs();
      apply();
      return;
    }
    var row = byId(pendingDeleteId);
    closeDelete();
    if (!row) return;
    breakGroup(row);
    rows.splice(rows.indexOf(row), 1);
    fillCats();
    renderTabs();
    apply();
  });
  fillCats();
  renderTabs();
  apply();
})();
</script>
</body>
</html>
