<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>整改建议 - 通信铁塔检测系统</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="../../../../assets/pc-layout.css">
<style>
.rectify-table td { vertical-align:middle; line-height:1.6; }
.mask { position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:2000; display:none; align-items:center; justify-content:center; padding:20px; }
.mask.open { display:flex; }
.dialog { background:#fff; border-radius:8px; width:min(640px,96vw); max-height:90vh; overflow:auto; box-shadow:0 12px 48px rgba(0,0,0,.18); }
.dialog-head { padding:14px 18px; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center; }
.dialog-head h3 { margin:0; font-size:16px; font-weight:600; }
.dialog-body { padding:18px 20px; }
.dialog-foot { padding:12px 18px; border-top:1px solid var(--border); display:flex; justify-content:flex-end; gap:8px; }
.dialog .form-input, .dialog .form-select, .dialog .form-textarea { width:100%; }
</style>
</head>
<body>
<div class="layout-wrap">
  <div class="layout-sidebar" id="sidebar">
    <div class="sidebar-logo">
      <i class="fa-solid fa-tower-broadcast"></i>
      <span class="logo-text">铁塔检测系统</span>
    </div>
    <nav class="sidebar-nav">
        <div class="menu-group open">
          <div class="menu-group-title" onclick="this.parentElement.classList.toggle('open')">
            <span><i class="fa-solid fa-tower-broadcast group-icon"></i>检测管理</span>
            <i class="fa-solid fa-chevron-right chevron"></i>
          </div>
          <div class="menu-group-items">
            <a class="menu-item" href="../../铁塔检测业务/报告编制/report-list.html">报告编制</a>
          </div>
        </div>
        <div class="menu-group open">
        <div class="menu-group-title" onclick="this.parentElement.classList.toggle('open')">
          <span><i class="fa-solid fa-database group-icon"></i>基础数据</span>
          <i class="fa-solid fa-chevron-right chevron"></i>
        </div>
        <div class="menu-group-items">
          <a class="menu-item active" href="pc_data_rectify.html">整改建议</a>
        </div>
      </div>
      <div class="menu-group">
        <div class="menu-group-title" onclick="this.parentElement.classList.toggle('open')">
          <span><i class="fa-solid fa-chart-column group-icon"></i>统计分析</span>
          <i class="fa-solid fa-chevron-right chevron"></i>
        </div>
        <div class="menu-group-items">
          <a class="menu-item" href="../../统计分析/问题汇总/pc_problem_summary.html">问题汇总</a>
        </div>
      </div>
    </nav>
    <div style="padding:12px 16px;border-top:1px solid rgba(255,255,255,0.08);display:flex;flex-direction:column;gap:8px">
      <a href="../../../../../../index.html?stay=1" style="color:rgba(255,255,255,0.75);font-size:12px;text-decoration:none;display:flex;align-items:center;gap:6px"><i class="fa-solid fa-house"></i>返回总入口</a>
      <a href="../../../../../../../docs/versions/v1.1.0/prd.html" style="color:rgba(255,255,255,0.75);font-size:12px;text-decoration:none;display:flex;align-items:center;gap:6px"><i class="fa-solid fa-file-lines"></i>查看 PRD</a>
    </div>
  </div>
  <div class="layout-main">
    <div class="top-nav">
      <div class="breadcrumb">
        <a href="../../../../index.html"><i class="fa-solid fa-house" style="font-size:13px"></i></a>
        <span class="bc-sep">/</span><span>基础数据</span>
        <span class="bc-sep">/</span><span class="bc-current">整改建议</span>
      </div>
      <div class="top-nav-right">
        <div class="user-info"><i class="fa-solid fa-user-circle" style="font-size:20px;color:var(--text-3)"></i> 张伟</div>
      </div>
    </div>
    <div class="page-content">
      <div class="card">
        <div class="card-header"><div class="card-title">整改建议</div></div>
        <div class="card-body">
          <div class="toolbar">
            <div class="toolbar-left">
              <select class="form-select" id="itemFilter"><option value="">全部检测项目</option></select>
              <select class="form-select" id="riskFilter">
                <option value="">全部风险类别</option>
                <option>A类</option>
                <option>B类</option>
                <option>C类</option>
              </select>
              <select class="form-select" id="statusFilter">
                <option value="">全部状态</option>
                <option>启用</option>
                <option>禁用</option>
              </select>
              <input type="text" class="form-input" id="kwFilter" placeholder="检测项目 / 整改意见" style="width:260px">
              <button type="button" class="btn btn-primary" id="btnQuery">查询</button>
              <button type="button" class="btn btn-default" id="btnReset">重置</button>
            </div>
          </div>
          <div class="pc-table-actions">
            <button type="button" class="btn btn-primary" id="btnAdd"><i class="fa-solid fa-plus"></i> 新增</button>
          </div>
          <table class="data-table rectify-table">
            <thead>
              <tr>
                <th style="width:220px;">检测项目</th>
                <th style="width:120px;">风险类别</th>
                <th>整改意见</th>
                <th style="width:88px;">状态</th>
                <th class="col-action" style="width:168px;">操作</th>
              </tr>
            </thead>
            <tbody id="rectifyBody"></tbody>
          </table>
          <div class="pagination"><span id="rectifyCount">共 0 条记录</span></div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="mask" id="formMask">
  <div class="dialog" role="dialog" aria-labelledby="formTitle">
    <div class="dialog-head">
      <h3 id="formTitle">新增整改建议</h3>
      <button type="button" class="btn btn-text" id="formClose" aria-label="关闭"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div class="dialog-body">
      <div class="form-grid" style="grid-template-columns:1fr 1fr;">
        <div class="form-group">
          <span class="form-label">检测项目<span class="required">*</span></span>
          <input type="text" class="form-input" id="formItem" placeholder="请输入检测项目">
        </div>
        <div class="form-group">
          <span class="form-label">风险类别<span class="required">*</span></span>
          <select class="form-select" id="formRisk"><option>A类</option><option>B类</option><option>C类</option></select>
        </div>
        <div class="form-group">
          <span class="form-label">状态<span class="required">*</span></span>
          <select class="form-select" id="formStatus"><option>启用</option><option>禁用</option></select>
        </div>
        <div class="form-group full">
          <span class="form-label">整改意见<span class="required">*</span></span>
          <textarea class="form-textarea" id="formAdvice" placeholder="请输入整改意见"></textarea>
        </div>
      </div>
    </div>
    <div class="dialog-foot">
      <button type="button" class="btn btn-default" id="formCancel">取消</button>
      <button type="button" class="btn btn-primary" id="formSave">保存</button>
    </div>
  </div>
</div>

<div class="mask" id="delMask">
  <div class="dialog" role="dialog" style="width:min(420px,96vw);">
    <div class="dialog-head"><h3>删除整改建议</h3></div>
    <div class="dialog-body"><p id="delMsg" style="font-size:14px;color:var(--text-2);line-height:1.6;margin:0;">确定删除？</p></div>
    <div class="dialog-foot">
      <button type="button" class="btn btn-default" id="delCancel">取消</button>
      <button type="button" class="btn btn-danger" id="delOk">删除</button>
    </div>
  </div>
</div>

<script>
(function () {
  var RISKS = ["A类", "B类", "C类"];
  var STATUSES = ["启用", "禁用"];
  var rows = [
    { item: "构件是否变形", risk: "A类", advice: "" },
    { item: "构件是否变形", risk: "B类", advice: "" },
    { item: "构件是否变形", risk: "C类", advice: "" },
    { item: "构件是否缺失", risk: "A类", advice: "" },
    { item: "构件是否缺失", risk: "B类", advice: "" },
    { item: "构件是否缺失", risk: "C类", advice: "" }
  ];
  var nextId = 1;
  rows.forEach(function (r) {
    r.id = nextId++;
    if (STATUSES.indexOf(r.status) < 0) r.status = "启用";
  });
  var editingId = 0;
  var pendingDeleteId = 0;
  var body = document.getElementById("rectifyBody");
  var countEl = document.getElementById("rectifyCount");

  function byId(id) {
    for (var i = 0; i < rows.length; i++) if (rows[i].id === id) return rows[i];
    return null;
  }
  function esc(s) {
    return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }
  function riskRank(risk) {
    var i = RISKS.indexOf(risk);
    return i < 0 ? 99 : i;
  }
  function sorted(list) {
    return list.slice().sort(function (a, b) {
      if (a.item !== b.item) return a.item < b.item ? -1 : 1;
      return riskRank(a.risk) - riskRank(b.risk);
    });
  }
  function filters() {
    return {
      item: document.getElementById("itemFilter").value,
      risk: document.getElementById("riskFilter").value,
      status: document.getElementById("statusFilter").value,
      kw: document.getElementById("kwFilter").value.trim()
    };
  }
  function matched(r, f) {
    if (f.item && r.item !== f.item) return false;
    if (f.risk && r.risk !== f.risk) return false;
    if (f.status && r.status !== f.status) return false;
    if (f.kw && (r.item + " " + r.advice).indexOf(f.kw) < 0) return false;
    return true;
  }
  function refreshItemFilter() {
    var current = document.getElementById("itemFilter").value;
    var names = [];
    rows.forEach(function (r) {
      if (r.item && names.indexOf(r.item) < 0) names.push(r.item);
    });
    names.sort();
    var html = '<option value="">全部检测项目</option>';
    names.forEach(function (name) {
      html += '<option value="' + esc(name) + '"' + (name === current ? " selected" : "") + ">" + esc(name) + "</option>";
    });
    document.getElementById("itemFilter").innerHTML = html;
  }
  function render() {
    refreshItemFilter();
    var f = filters();
    var list = sorted(rows).filter(function (r) { return matched(r, f); });
    if (!list.length) {
      body.innerHTML = '<tr><td colspan="5" style="text-align:center;color:var(--text-3);padding:28px;">没有匹配的记录</td></tr>';
    } else {
      body.innerHTML = list.map(function (r) {
        var on = r.status === "启用";
        var next = on ? "禁用" : "启用";
        return "<tr><td>" + esc(r.item) + "</td><td>" + esc(r.risk) + "</td><td>" + esc(r.advice) + "</td><td><span class=\"tag " + (on ? "tag-green" : "tag-gray") + "\">" + esc(r.status) + "</span></td><td>"
          + '<button type="button" class="btn btn-text" data-edit="' + r.id + '">编辑</button>'
          + '<button type="button" class="btn btn-text" data-status="' + r.id + '">' + next + '</button>'
          + '<button type="button" class="btn btn-text" data-del="' + r.id + '" style="color:var(--danger)">删除</button>'
          + "</td></tr>";
      }).join("");
    }
    countEl.textContent = "共 " + list.length + " 条记录";
  }
  function openForm(row) {
    editingId = row ? row.id : 0;
    document.getElementById("formTitle").textContent = row ? "编辑整改建议" : "新增整改建议";
    document.getElementById("formItem").value = row ? row.item : "";
    document.getElementById("formRisk").value = row ? row.risk : "A类";
    document.getElementById("formStatus").value = row && row.status === "禁用" ? "禁用" : "启用";
    document.getElementById("formAdvice").value = row ? row.advice : "";
    document.getElementById("formMask").classList.add("open");
  }
  function closeForm() { document.getElementById("formMask").classList.remove("open"); }
  function duplicate(item, risk, id) {
    return rows.some(function (r) { return r.id !== id && r.item === item && r.risk === risk; });
  }
  function saveForm() {
    var item = document.getElementById("formItem").value.trim();
    var risk = document.getElementById("formRisk").value;
    var advice = document.getElementById("formAdvice").value.trim();
    var status = document.getElementById("formStatus").value;
    if (!item) { alert("请填写检测项目"); return; }
    if (RISKS.indexOf(risk) < 0) { alert("请选择风险类别"); return; }
    if (STATUSES.indexOf(status) < 0) { alert("请选择状态"); return; }
    if (!advice) { alert("请填写整改意见"); return; }
    if (duplicate(item, risk, editingId)) { alert("同一检测项目下已有该风险类别"); return; }
    if (editingId) {
      var row = byId(editingId);
      if (!row) return;
      row.item = item;
      row.risk = risk;
      row.advice = advice;
      row.status = status;
    } else {
      rows.push({ id: nextId++, item: item, risk: risk, advice: advice, status: status });
    }
    closeForm();
    render();
  }
  function askDelete(id) {
    var row = byId(id);
    if (!row) return;
    pendingDeleteId = id;
    document.getElementById("delMsg").textContent = "确定删除「" + row.item + " / " + row.risk + "」？删除后不可恢复。";
    document.getElementById("delMask").classList.add("open");
  }
  function closeDelete() {
    pendingDeleteId = 0;
    document.getElementById("delMask").classList.remove("open");
  }

  document.getElementById("btnQuery").addEventListener("click", render);
  document.getElementById("kwFilter").addEventListener("keydown", function (e) { if (e.key === "Enter") render(); });
  document.getElementById("itemFilter").addEventListener("change", render);
  document.getElementById("riskFilter").addEventListener("change", render);
  document.getElementById("statusFilter").addEventListener("change", render);
  document.getElementById("btnReset").addEventListener("click", function () {
    document.getElementById("itemFilter").value = "";
    document.getElementById("riskFilter").value = "";
    document.getElementById("statusFilter").value = "";
    document.getElementById("kwFilter").value = "";
    render();
  });
  document.getElementById("btnAdd").addEventListener("click", function () { openForm(null); });
  document.getElementById("formClose").addEventListener("click", closeForm);
  document.getElementById("formCancel").addEventListener("click", closeForm);
  document.getElementById("formSave").addEventListener("click", saveForm);
  document.getElementById("delCancel").addEventListener("click", closeDelete);
  document.getElementById("delOk").addEventListener("click", function () {
    rows = rows.filter(function (r) { return r.id !== pendingDeleteId; });
    closeDelete();
    render();
  });
  body.addEventListener("click", function (e) {
    var edit = e.target.closest("[data-edit]");
    var del = e.target.closest("[data-del]");
    var statusBtn = e.target.closest("[data-status]");
    if (edit) openForm(byId(Number(edit.getAttribute("data-edit"))));
    if (del) askDelete(Number(del.getAttribute("data-del")));
    if (statusBtn) {
      var row = byId(Number(statusBtn.getAttribute("data-status")));
      if (!row) return;
      row.status = row.status === "启用" ? "禁用" : "启用";
      render();
    }
  });
  render();
})();
</script>
</body>
</html>
