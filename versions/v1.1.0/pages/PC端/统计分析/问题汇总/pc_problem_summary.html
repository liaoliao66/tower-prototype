    { taskId:"RW6", area:"海林市", name:"牡丹江海林市影视城", code:"231083908000000114", lng:"129.121698", lat:"44.784083", reportNo:"GGJC2600900879", conclusion:"经整改维护后，目标使用年限为10年。不满足风压0.55、0.60kN/m2条件下继续新增天线的承载力要求。", advice:"主肢螺栓双螺母紧固；除锈后涂防锈底漆两遍后再涂面漆两遍。", inspectStatus:"", inspectDate:"2026-01-16", reportDate:"2026-01-28", projectId:"P26", projectName:"牡丹江2026年铁塔安全检测工程", orderId:"O26A", orderNo:"MDJ20260108-001" },
    { taskId:"RW12", area:"林口县", name:"林口县铁塔站", code:"231025908000000088", lng:"130.268441", lat:"45.278902", reportNo:"GGJC2600900881", conclusion:"经整改维护后，目标使用年限为10年。整体结构安全性评定为三级。", advice:"补装缺失螺栓，主肢螺栓双螺母紧固。", inspectStatus:"", inspectDate:"2026-01-09", reportDate:"2026-01-19", projectId:"P26", projectName:"牡丹江2026年铁塔安全检测工程", orderId:"O26A", orderNo:"MDJ20260108-001" },

    { taskId:"RW9", area:"宁安", name:"兰岗东进模块局", code:"231084908000000170", lng:"129.365734", lat:"44.312051", reportNo:"GGJC2600906110", conclusion:"同一站址第二次检测。经整改维护后，目标使用年限为10年。", advice:"主肢螺栓双螺母紧固；按原设计规格更换锈蚀严重构件。", inspectStatus:"", inspectDate:"2026-03-18", reportDate:"2026-04-02", projectId:"P26", projectName:"牡丹江2026年铁塔安全检测工程", orderId:"O26B", orderNo:"MDJ20260301-002" },
    { taskId:"RW10", area:"爱民区", name:"爱民区铁塔站", code:"231004908000000066", lng:"129.590440", lat:"44.595210", reportNo:"GGJC2600904012", conclusion:"经整改维护后，目标使用年限为10年。整体结构使用性评定为三级。", advice:"清理塔脚积水，补做排水。", inspectStatus:"", inspectDate:"2026-03-22", reportDate:"2026-04-08", projectId:"P26", projectName:"牡丹江2026年铁塔安全检测工程", orderId:"O26B", orderNo:"MDJ20260301-002" },
    { taskId:"RW11", area:"东安区", name:"东安区铁塔站", code:"231002908000000033", lng:"129.626770", lat:"44.581090", reportNo:"GGJC2600900880", conclusion:"经整改维护后，目标使用年限为10年。满足风压0.50kN/m2条件下的承载力使用要求。", advice:"通信塔按技术要求定期维护。", inspectStatus:"", inspectDate:"2026-04-09", reportDate:"2026-04-18", projectId:"P26", projectName:"牡丹江2026年铁塔安全检测工程", orderId:"O26A", orderNo:"MDJ20260108-001" }
  ];

  ROWS.forEach(function (r) {
    r.province = "黑龙江省";
    r.city = "牡丹江市";
    r.district = r.area || "";
  });

  function esc(s) {
    return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }
  function xml(s) {
    return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }
  function inRange(value, start, end) {
    if (!start && !end) return true;
    if (!value) return false;
    if (start && value < start) return false;
    if (end && value > end) return false;
    return true;
  }
  function kwText() { return (document.getElementById("kw").value || "").trim(); }
  function matchKw(r) {
    var kw = kwText();
    if (!kw) return true;
    var blob = [r.area, r.name, r.code, r.reportNo, r.projectName, r.orderNo].join(" ");
    return blob.indexOf(kw) >= 0;
  }
  function matchDates(r) {
    return inRange(r.inspectDate, document.getElementById("inspectStart").value, document.getElementById("inspectEnd").value)
      && inRange(r.reportDate, document.getElementById("reportStart").value, document.getElementById("reportEnd").value);
  }
  function matchRegion(r) {
    var province = document.getElementById("provinceFilter").value;
    var city = document.getElementById("cityFilter").value;
    var district = document.getElementById("districtFilter").value;
    if (province && r.province !== province) return false;
    if (city && r.city !== city) return false;
    if (district && r.district !== district) return false;
    return true;
  }
  function baseFiltered() {
    return ROWS.filter(function (r) { return matchKw(r) && matchDates(r) && matchRegion(r); });
  }
  function shown() {
    return baseFiltered().sort(function (a, b) {
      var da = a.inspectDate || "0000-00-00";
      var db = b.inspectDate || "0000-00-00";
      if (da !== db) return da < db ? 1 : -1;
      return a.reportNo < b.reportNo ? 1 : -1;
    });
  }
  function allSorted() {
    return ROWS.slice().sort(function (a, b) {
      var da = a.inspectDate || "0000-00-00";
      var db = b.inspectDate || "0000-00-00";
      if (da !== db) return da < db ? 1 : -1;
      return a.reportNo < b.reportNo ? 1 : -1;
    });
  }

  function uniqueValues(list, key) {
    var out = [];
    list.forEach(function (r) {
      var value = r[key];
      if (value && out.indexOf(value) < 0) out.push(value);
    });
    return out;
  }
  function fillSelect(id, placeholder, values, current) {
    var html = '<option value="">' + placeholder + "</option>";
    values.forEach(function (value) {
      html += '<option value="' + esc(value) + '"' + (value === current ? " selected" : "") + ">" + esc(value) + "</option>";
    });
    document.getElementById(id).innerHTML = html;
  }
  function refreshRegionSelects() {
    var province = document.getElementById("provinceFilter").value;
    var city = document.getElementById("cityFilter").value;
    var district = document.getElementById("districtFilter").value;
    var provinces = uniqueValues(ROWS, "province");
    if (provinces.indexOf(province) < 0) province = "";
    var cities = uniqueValues(ROWS.filter(function (r) { return !province || r.province === province; }), "city");
    if (cities.indexOf(city) < 0) city = "";
    var districts = uniqueValues(ROWS.filter(function (r) {
      return (!province || r.province === province) && (!city || r.city === city);
    }), "district");
    if (districts.indexOf(district) < 0) district = "";
    fillSelect("provinceFilter", "全部省", provinces, province);
    fillSelect("cityFilter", "全部市", cities, city);
    fillSelect("districtFilter", "全部区", districts, district);
  }

  function renderTable() {
    var list = shown();
    var body = document.getElementById("tbody");
    if (!list.length) {
      body.innerHTML = '<tr><td colspan="14" style="text-align:center;color:var(--text-3);padding:28px;">没有匹配的记录</td></tr>';
    } else {
      body.innerHTML = list.map(function (r, i) {
        return "<tr><td>" + (i + 1) + "</td><td>" + esc(r.area) + "</td><td>" + esc(r.name) + "</td><td>" + esc(r.code) + "</td><td>" + esc(r.lng) + "</td><td>" + esc(r.lat) + "</td><td>" + esc(r.reportNo) + "</td><td><div class=\"clamp\" title=\"" + esc(r.conclusion) + "\">" + esc(r.conclusion) + "</div></td><td><div class=\"clamp\" title=\"" + esc(r.advice) + "\">" + esc(r.advice) + "</div></td><td>" + esc(r.inspectStatus) + "</td><td>" + esc(r.inspectDate) + "</td><td>" + esc(r.reportDate) + "</td><td>" + esc(r.projectName) + "</td><td>" + esc(r.orderNo) + "</td></tr>";
      }).join("");
    }
    document.getElementById("totalText").textContent = "共 " + list.length + " 条";
  }
  function render() {
    renderTable();
  }
  function line(r, index) {
    var vals = [index, r.area, r.name, r.code, r.lng, r.lat, r.reportNo, r.conclusion, r.advice, r.inspectStatus, r.inspectDate, r.reportDate, r.projectName, r.orderNo];
    return "<Row>" + vals.map(function (v) {
      return '<Cell><Data ss:Type="String">' + xml(v) + "</Data></Cell>";
    }).join("") + "</Row>";
  }
  function download(list, filename) {
    var xmlText = '<?xml version="1.0" encoding="UTF-8"?>'
      + '<?mso-application progid="Excel.Sheet"?>'
      + '<Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet">'
      + '<Worksheet ss:Name="Sheet1"><Table>'
      + "<Row>" + HEADERS.map(function (h) { return '<Cell><Data ss:Type="String">' + xml(h) + "</Data></Cell>"; }).join("") + "</Row>"
      + list.map(function (r, i) { return line(r, i + 1); }).join("")
      + "</Table></Worksheet></Workbook>";
    var blob = new Blob([xmlText], { type: "application/vnd.ms-excel;charset=utf-8" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
  }

  document.getElementById("provinceFilter").addEventListener("change", function () {
    document.getElementById("cityFilter").value = "";
    document.getElementById("districtFilter").value = "";
    refreshRegionSelects();
    render();
  });
  document.getElementById("cityFilter").addEventListener("change", function () {
    document.getElementById("districtFilter").value = "";
    refreshRegionSelects();
    render();
  });
  document.getElementById("districtFilter").addEventListener("change", render);
  document.getElementById("btnSearch").addEventListener("click", render);
  document.getElementById("kw").addEventListener("input", render);
  document.getElementById("kw").addEventListener("keydown", function (e) { if (e.key === "Enter") render(); });
  ["inspectStart","inspectEnd","reportStart","reportEnd"].forEach(function (id) {
    document.getElementById(id).addEventListener("change", render);
  });
  document.getElementById("btnReset").addEventListener("click", function () {
    document.getElementById("kw").value = "";
    document.getElementById("inspectStart").value = "";
    document.getElementById("inspectEnd").value = "";
    document.getElementById("reportStart").value = "";
    document.getElementById("reportEnd").value = "";
    document.getElementById("provinceFilter").value = "";
    document.getElementById("cityFilter").value = "";
    document.getElementById("districtFilter").value = "";
    refreshRegionSelects();
    render();
  });
  document.getElementById("btnExportAll").addEventListener("click", function () {
    download(allSorted(), "问题汇总.xls");
  });
  document.getElementById("btnExportFilter").addEventListener("click", function () {
    download(shown(), "问题汇总-筛选.xls");
  });
  refreshRegionSelects();
  render();
})();
</script>
</body>
</html>
