<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>问题整改 - 报告编制</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="../../../../assets/pc-layout.css">
<style>
  .stepbar { display:flex; gap:8px; margin-bottom:16px; }
  .stepbar span { padding:6px 12px; border-radius:16px; font-size:13px; background:#F2F3F5; color:var(--text-2); }
  .stepbar span.on { background:var(--primary); color:#fff; }
  .section-title { font-size:14px; font-weight:600; color:var(--text-1); margin-bottom:12px; padding-left:10px; border-left:3px solid var(--primary); }
  .group-card { border:1px solid var(--border); border-radius:8px; padding:14px; margin-bottom:14px; }
  .item-table th, .item-table td { border:1px solid #E5E6EB; padding:8px; font-size:12px; vertical-align:top; }
  .item-table th { background:#F7F8FA; font-weight:600; color:var(--text-2); }
  .item-table select, .item-table input { width:100%; border:1px solid #D0D3D9; border-radius:4px; padding:4px 6px; font-size:12px; min-height:32px; background:#fff; }
  .custom-advice { margin-top:6px; }
</style>
</head>
<body>
<div id="page-content">
  <div class="card">
    <div class="card-header"><div class="card-title" id="pageTitle">发起报告编制</div></div>
    <div class="card-body">
      <div class="stepbar">
        <span class="on">1. 问题整改</span>
        <span>2. 编辑报告</span>
      </div>
      <p style="font-size:12px;color:var(--text-3);margin:0 0 12px;">问题清单读取本检测任务检毕后的检出隐患。用隐患描述匹配基础数据中启用的检测项目：名称一致、隐患包含检测项目，或检测项目含「是否」时用后面的词去匹配。选中风险类别后，推送该项目下对应的整改意见。禁用的不推送。选择「其他」时手动填写，只保存在本报告。</p>
      <p id="detectNote" style="font-size:12px;color:var(--text-2);margin:-4px 0 12px;"></p>
      <div class="form-grid form-grid-3" style="margin-bottom:16px;">
        <div class="form-group"><span class="form-label">报告编号</span><div class="readonly-field" id="reportNoView" style="background:#F7F8FA;border:1px solid var(--border);border-radius:4px;padding:6px 12px;font-size:13px;">—</div></div>
        <div class="form-group"><span class="form-label">铁塔</span><div class="readonly-field" id="towerView" style="background:#F7F8FA;border:1px solid var(--border);border-radius:4px;padding:6px 12px;font-size:13px;">—</div></div>
        <div class="form-group"><span class="form-label">检测类型</span><div class="readonly-field" id="typeView" style="background:#F7F8FA;border:1px solid var(--border);border-radius:4px;padding:6px 12px;font-size:13px;">—</div></div>
      </div>
      <div style="margin-bottom:12px;">
        <input id="problemKw" class="form-input" placeholder="搜索隐患 / 检测项目 / 整改意见" style="width:280px">
      </div>
      <div id="problemGroups"></div>
      <div class="form-footer">
        <a href="report-list.html" class="btn btn-default">返回列表</a>
        <button type="button" class="btn btn-primary" id="btnNext">下一步：编辑报告</button>
      </div>
    </div>
  </div>
</div>
<script src="../../../../assets/pc-shell.js"></script>
<script>window.__layoutConfig = {active:'report_generate', breadcrumb:['检测管理','报告编制','问题整改']};</script>
<script>
(function () {
  var REPORT_KEY = "tower_reports_v111";
  var ADVICE_KEY = "tower_rectify_advice_v111";
  var RISKS = ["A类", "B类", "C类"];
  var FINDINGS = {
    "RW202605001": [
      { cat: "构件质量", hazard: "塔体主材构件变形或辅材变形严重多处" },
      { cat: "构件质量", hazard: "塔体主材构件上有盲孔" },
      { cat: "螺栓连接质量", hazard: "塔体构件连接螺栓松动过多" },
      { cat: "拉线质量", hazard: "拉线锈蚀严重" },
      { cat: "基础情况质量", hazard: "塔脚基础下沉明显" }
    ],
    "RW202605002": [
      { cat: "构件质量", hazard: "主材或辅材构件锈蚀" },
      { cat: "防腐层质量", hazard: "构件防腐涂层脱落、掉渣严重" },
      { cat: "螺栓连接质量", hazard: "塔体构件连接螺栓松动" },
      { cat: "附属结构质量", hazard: "爬钉断裂" }
    ],
    "RW202605003": [
      { cat: "构件质量", hazard: "塔体主材构件变形或辅材变形严重多处" },
      { cat: "构件质量", hazard: "辅材构件缺失" },
      { cat: "螺栓连接质量", hazard: "塔体构件连接螺栓松动过多" }
    ]
  };
  var params = new URLSearchParams(location.search);
  var reportId = params.get("reportId") || "";
  var fromEdit = params.get("from") === "edit";
  var report = null;
  var problems = [];

  function load() {
    try { return JSON.parse(localStorage.getItem(REPORT_KEY) || "[]"); } catch (e) { return []; }
  }
  function save(list) { localStorage.setItem(REPORT_KEY, JSON.stringify(list)); }
  function esc(s) {
    return String(s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }
  function loadAdvice() {
    try { return JSON.parse(localStorage.getItem(ADVICE_KEY) || "[]"); } catch (e) { return []; }
  }
  function normRisk(value) {
    if (value === "A级") return "A类";
    if (value === "B级") return "B类";
    if (value === "C级") return "C类";
    return value || "";
  }
  function matchKey(item) {
    var idx = String(item || "").indexOf("是否");
    return idx >= 0 ? item.slice(idx + 2) : item;
  }
  function matchItem(hazard) {
    var text = String(hazard || "");
    var best = "";
    var bestLen = 0;
    loadAdvice().forEach(function (r) {
      if (!r.item || r.status === "禁用") return;
      var len = 0;
      if (text === r.item) len = r.item.length + 100;
      else if (text.indexOf(r.item) >= 0) len = r.item.length;
      else {
        var key = matchKey(r.item);
        if (key && key.length >= 2 && text.indexOf(key) >= 0) len = key.length;
      }
      if (len > bestLen) { bestLen = len; best = r.item; }
    });
    return best;
  }
  function adviceRow(item, risk) {
    var hit = null;
    loadAdvice().forEach(function (r) {
      if (r.item === item && r.risk === risk && r.status !== "禁用") hit = r;
    });
    return hit;
  }
  function pushedAdvice(item, risk) {
    var row = adviceRow(item, risk);
    return row && row.advice ? row.advice : "";
  }
  function fillAdvice(select, input, row) {
    var text = row.custom ? "" : pushedAdvice(row.item, row.level);
    if (!row.custom && text) row.advice = text;
    var html = '<option value="">请选择整改意见</option>';
    if (text) html += '<option value="' + esc(text) + '">' + esc(text) + "</option>";
    html += '<option value="__other__">其他</option>';
    select.innerHTML = html;
    if (row.custom) {
      select.value = "__other__";
      input.style.display = "";
      input.value = row.advice || "";
    } else if (text && row.advice === text) {
      select.value = text;
      input.style.display = "none";
      input.value = "";
    } else if (row.advice) {
      select.value = "__other__";
      row.custom = true;
      input.style.display = "";
      input.value = row.advice;
    } else {
      input.style.display = "none";
      input.value = "";
    }
  }
  function problemVisible(p) {
    var el = document.getElementById("problemKw");
    var kw = el ? el.value.trim() : "";
    if (!kw) return true;
    return (p.cat + p.hazard + (p.level || "") + (p.advice || "")).indexOf(kw) >= 0;
  }
  function render() {
    if (!problems.length) {
      document.getElementById("problemGroups").innerHTML = '<div class="group-card" style="font-size:13px;color:var(--text-3);">本任务未检出隐患。可进入报告编辑，问题与整改意见模块将为空。</div>';
      return;
    }
    var order = [];
    var map = {};
    problems.forEach(function (p, idx) {
      p._idx = idx;
      if (!map[p.cat]) { map[p.cat] = []; order.push(p.cat); }
      map[p.cat].push(p);
    });
    var html = "";
    order.forEach(function (cat) {
      var list = map[cat].filter(problemVisible);
      if (!list.length) return;
      html += '<div class="group-card"><div class="section-title">' + esc(cat) + '</div>';
      html += '<table class="item-table" style="width:100%;border-collapse:collapse;"><thead><tr><th>隐患</th><th style="width:120px;">隐患等级</th><th style="width:42%;">整改建议</th></tr></thead><tbody>';
      list.forEach(function (p) {
        html += '<tr data-idx="' + p._idx + '"><td>' + esc(p.hazard) + '</td>';
        html += '<td><select class="lv" data-idx="' + p._idx + '"><option value="">请选择</option><option>A级</option><option>B级</option><option>C级</option></select></td>';
        html += '<td><select class="adv" data-idx="' + p._idx + '"></select><input class="custom-advice" data-idx="' + p._idx + '" placeholder="请手动填写整改建议" style="display:none"></td></tr>';
      });
      html += "</tbody></table></div>";
    });
    if (!html) {
      document.getElementById("problemGroups").innerHTML = '<div class="group-card" style="font-size:13px;color:var(--text-3);">没有匹配的隐患</div>';
      return;
    }
    document.getElementById("problemGroups").innerHTML = html;
    problems.forEach(function (p) {
      var lv = document.querySelector('.lv[data-idx="' + p._idx + '"]');
      if (!lv) return;
      var adv = document.querySelector('.adv[data-idx="' + p._idx + '"]');
      var input = document.querySelector('.custom-advice[data-idx="' + p._idx + '"]');
      if (p.level) lv.value = p.level;
      fillAdvice(adv, input, p);
      lv.addEventListener("change", function () {
        p.level = lv.value;
        p.advice = "";
        p.custom = false;
        fillAdvice(adv, input, p);
      });
      adv.addEventListener("change", function () {
        if (adv.value === "__other__") {
          p.custom = true;
          p.advice = input.value.trim();
          input.style.display = "";
        } else {
          p.custom = false;
          p.advice = adv.value;
          input.style.display = "none";
          input.value = "";
        }
      });
      input.addEventListener("input", function () { p.advice = input.value.trim(); p.custom = true; });
    });
  }
  function collectOk() {
    for (var i = 0; i < problems.length; i++) {
      var p = problems[i];
      if (!p.level) { alert("请为全部隐患选择隐患等级"); return false; }
      if (p.custom) {
        var input = document.querySelector('.custom-advice[data-idx="' + i + '"]');
        p.advice = input ? input.value.trim() : "";
        if (!p.advice) { alert("选择「其他」时，请手动填写整改建议"); return false; }
      } else if (!p.advice) {
        alert("请为全部隐患选择整改建议");
        return false;
      }
    }
    return true;
  }
  function goNext() {
    if (!collectOk()) return;
    var list = load();
    var idx = list.findIndex(function (r) { return r.id === report.id; });
    if (idx < 0) { alert("未找到报告"); return; }
    var row = list[idx];
    row.detected = problems.map(function (p) { return { cat: p.cat, hazard: p.hazard }; });
    row.problems = problems.map(function (p) {
      return { cat: p.cat, hazard: p.hazard, level: p.level, advice: p.advice, custom: !!p.custom };
    });
    row.problemsReady = true;
    if (row.status === "待编制") {
      row.status = "编制中";
      row.auditStatus = "未提交";
      row.auditNode = "未发起审核";
      if (!row.compiler || row.compiler === "—") row.compiler = "张伟";
    }
    list[idx] = row;
    save(list);
    location.href = "report-edit.html?reportId=" + encodeURIComponent(row.id);
  }

  if (fromEdit) {
    document.getElementById("pageTitle").textContent = "编辑整改意见";
    document.getElementById("btnNext").textContent = "保存并返回报告";
  }
  var list = load();
  report = list.find(function (r) { return r.id === reportId; });
  if (!report) {
    location.replace("report-list.html");
  } else if (report.status === "已编制" || report.status === "已出报告") {
    location.replace("report-detail.html?reportId=" + encodeURIComponent(report.id));
  } else {
    document.getElementById("reportNoView").textContent = report.reportNo || "—";
    document.getElementById("towerView").textContent = (report.towerCode || "") + " / " + (report.towerName || "");
    document.getElementById("typeView").textContent = report.inspectType || "—";
    var detected = (report.detected && report.detected.length) ? report.detected : (FINDINGS[report.taskId] || []);
    var saved = report.problems || [];
    document.getElementById("detectNote").textContent = "检测任务 " + (report.taskId || "—") + " · 检出 " + detected.length + " 条隐患";
    problems = detected.map(function (d) {
      var hit = null;
      for (var i = 0; i < saved.length; i++) {
        if (saved[i].cat === d.cat && saved[i].hazard === d.hazard) hit = saved[i];
      }
      return {
        cat: d.cat,
        hazard: d.hazard,
        level: hit ? (hit.level || "") : "",
        advice: hit ? (hit.advice || "") : "",
        custom: hit ? !!hit.custom : false
      };
    });
    render();
    var kwInput = document.getElementById("problemKw");
    if (kwInput) kwInput.addEventListener("input", render);
    document.getElementById("btnNext").addEventListener("click", goNext);
  }
})();
</script>
</body>
</html>
